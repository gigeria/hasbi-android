name: Build Hasbi APK

# Triggers: when code is pushed or PR is made
on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📝 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔍 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Download Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"'

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hasbi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: ✅ Build Success Notification
        if: success()
        run: |
          echo "🎉 APK built successfully!"
          echo "📱 Download from Artifacts section above"
          echo "📦 File: hasbi-debug.apk"
          echo "🔐 Debug build — install with 'Unknown sources' enabled"
